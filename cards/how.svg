<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Como eu trabalho"><title>Como eu trabalho</title><rect x=".5" y=".5" width="879" height="219" rx="8" fill="#2d353b" stroke="#475258"/><text x="28" y="30" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" fill="#dbbc7f" font-weight="700">04</text><text x="58" y="30" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" fill="#9da9a0" letter-spacing="1.5">COMO EU TRABALHO</text><line x1="28" y1="42" x2="852" y2="42" stroke="#475258" stroke-width="1"/><text x="28" y="74" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#a7c080" font-weight="700">Código que se explica.</text><text x="258" y="74" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9da9a0">Nomes claros, camadas bem separadas e um README com setup, limites e decisões.</text><text x="28" y="102" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#83c092" font-weight="700">Testes antes de confiar.</text><text x="258" y="102" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9da9a0">JUnit, Mockito e Testcontainers. Essa parte ainda está em evolução e é uma</text><text x="258" y="122" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9da9a0">prioridade.</text><text x="28" y="150" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#7fbbb3" font-weight="700">Registrar o caminho.</text><text x="258" y="150" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9da9a0">Anoto decisões e erros, não só o que funcionou.</text><text x="28" y="178" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#dbbc7f" font-weight="700">IA com critério.</text><text x="258" y="178" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="13.5" fill="#9da9a0">Uso IA como apoio, mas preciso conseguir explicar cada decisão do código.</text></svg>
