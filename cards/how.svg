<svg xmlns="http://www.w3.org/2000/svg" width="908" height="261" viewBox="0 0 908 261" role="img" aria-label="Como eu trabalho"><title>Como eu trabalho</title><style>@font-face{font-family:'PMono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'PSans';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'PSansB';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><rect x="14.5" y="14.5" width="879" height="232" fill="#1d2326" stroke="#38434a" stroke-width="1"/><g transform="translate(14,14)"><text x="36.0" y="32.0" font-family="PMono" font-size="11" fill="#dbbc7f">04</text><text x="70.0" y="32.0" font-family="PMono" font-size="10" fill="#a3ada5" letter-spacing="1.6">COMO EU TRABALHO</text><line x1="36.0" y1="46.0" x2="844.0" y2="46.0" stroke="#2c373d" stroke-width="1"/><text x="36.0" y="84.0" font-family="PSansB" font-size="14" fill="#a7c080">Código que se explica.</text><text x="286.0" y="84.0" font-family="PSans" font-size="13.5" fill="#a3ada5">Nomes claros, camadas bem separadas e um README com setup, limites e decisões.</text><text x="36.0" y="115.0" font-family="PSansB" font-size="14" fill="#83c092">Testes antes de confiar.</text><text x="286.0" y="115.0" font-family="PSans" font-size="13.5" fill="#a3ada5">JUnit, Mockito e Testcontainers. Essa parte ainda está em evolução e é uma</text><text x="286.0" y="136.0" font-family="PSans" font-size="13.5" fill="#a3ada5">prioridade.</text><text x="36.0" y="167.0" font-family="PSansB" font-size="14" fill="#7fbbb3">Registrar o caminho.</text><text x="286.0" y="167.0" font-family="PSans" font-size="13.5" fill="#a3ada5">Anoto decisões e erros, não só o que funcionou.</text><text x="36.0" y="198.0" font-family="PSansB" font-size="14" fill="#dbbc7f">IA com critério.</text><text x="286.0" y="198.0" font-family="PSans" font-size="13.5" fill="#a3ada5">Uso IA como apoio, mas preciso conseguir explicar cada decisão do código.</text></g></svg>
