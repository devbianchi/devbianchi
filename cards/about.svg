<svg xmlns="http://www.w3.org/2000/svg" width="880" height="220" viewBox="0 0 880 220" role="img" aria-label="Sobre mim"><title>Sobre mim</title><rect x=".5" y=".5" width="879" height="219" rx="8" fill="#2d353b" stroke="#475258"/><text x="28" y="30" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" fill="#a7c080" font-weight="700">01</text><text x="58" y="30" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" fill="#9da9a0" letter-spacing="1.5">SOBRE</text><line x1="28" y1="42" x2="852" y2="42" stroke="#475258" stroke-width="1"/><text x="28" y="72" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14.5" fill="#d3c6aa">Sou estudante de Análise e Desenvolvimento de Sistemas na Fatec Indaiatuba. Trabalho como estagiário</text><text x="28" y="94" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14.5" fill="#d3c6aa">de TI na Infomatic, na área de infraestrutura e cloud, e estudo backend com Java e Spring todos os</text><text x="28" y="116" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14.5" fill="#d3c6aa">dias.</text><text x="28" y="148" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14.5" fill="#d3c6aa">Aprendo construindo. Cada projeto tem um objetivo claro, testes e um README que explica o que</text><text x="28" y="170" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14.5" fill="#d3c6aa">funciona, o que falta e o que eu faria diferente.</text></svg>
