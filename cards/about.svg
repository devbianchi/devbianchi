<svg xmlns="http://www.w3.org/2000/svg" width="896" height="212" viewBox="0 0 896 212" role="img" aria-label="Sobre mim"><title>Sobre mim</title><style>@font-face{font-family:'PMono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'PSans';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><rect x="8.5" y="0.5" width="879" height="211" fill="#1d2326" stroke="#38434a" stroke-width="1"/><g transform="translate(8,0)"><text x="36.0" y="32.0" font-family="PMono" font-size="11" fill="#a7c080">01</text><text x="70.0" y="32.0" font-family="PMono" font-size="10" fill="#a3ada5" letter-spacing="1.6">SOBRE</text><line x1="36.0" y1="46.0" x2="844.0" y2="46.0" stroke="#2c373d" stroke-width="1"/><text x="36.0" y="80.0" font-family="PSans" font-size="15" fill="#d3c6aa">Sou estudante de Análise e Desenvolvimento de Sistemas na Fatec Indaiatuba. Trabalho como estagiário de TI</text><text x="36.0" y="104.0" font-family="PSans" font-size="15" fill="#d3c6aa">na Infomatic, na área de infraestrutura e cloud, e estudo backend com Java e Spring todos os dias.</text><text x="36.0" y="142.0" font-family="PSans" font-size="15" fill="#d3c6aa">Aprendo construindo. Cada projeto tem um objetivo claro, testes e um README que explica o que funciona, o</text><text x="36.0" y="166.0" font-family="PSans" font-size="15" fill="#d3c6aa">que falta e o que eu faria diferente.</text></g></svg>
