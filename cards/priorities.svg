<svg xmlns="http://www.w3.org/2000/svg" width="908" height="254" viewBox="0 0 908 254" role="img" aria-label="Prioridades"><title>Prioridades</title><style>@font-face{font-family:'PMono';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}@font-face{font-family:'PSans';font-weight:400;font-style:normal;src:url(data:font/woff;base64,) format('woff')}</style><rect x="14.5" y="14.5" width="879" height="225" fill="#1d2326" stroke="#38434a" stroke-width="1"/><g transform="translate(14,14)"><text x="36.0" y="32.0" font-family="PMono" font-size="11" fill="#e69875">05</text><text x="70.0" y="32.0" font-family="PMono" font-size="10" fill="#a3ada5" letter-spacing="1.6">PRIORIDADES</text><line x1="36.0" y1="46.0" x2="844.0" y2="46.0" stroke="#2c373d" stroke-width="1"/><text x="36.0" y="84.0" font-family="PMono" font-size="12" fill="#7fbbb3">01</text><text x="80.0" y="84.0" font-family="PSans" font-size="14" fill="#d3c6aa">Japonês todos os dias, rumo ao N2.</text><text x="36.0" y="118.0" font-family="PMono" font-size="12" fill="#dbbc7f">02</text><text x="80.0" y="118.0" font-family="PSans" font-size="14" fill="#d3c6aa">Ganhar experiência como dev, no time de software da Infomatic ou numa vaga júnior de backend.</text><text x="36.0" y="152.0" font-family="PMono" font-size="12" fill="#e69875">03</text><text x="80.0" y="152.0" font-family="PSans" font-size="14" fill="#d3c6aa">Levar o MVP do L9s até o fim e publicar o Precify API com testes e deploy.</text><text x="36.0" y="186.0" font-family="PMono" font-size="12" fill="#d699b6">04</text><text x="80.0" y="186.0" font-family="PSans" font-size="14" fill="#d3c6aa">Concluir a certificação AWS Cloud Practitioner.</text></g></svg>
