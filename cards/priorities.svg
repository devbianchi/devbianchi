<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" role="img" aria-label="Prioridades"><title>Prioridades</title><rect x=".5" y=".5" width="879" height="199" rx="8" fill="#2d353b" stroke="#475258"/><text x="28" y="30" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" fill="#e69875" font-weight="700">05</text><text x="58" y="30" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="11" fill="#9da9a0" letter-spacing="1.5">PRIORIDADES</text><line x1="28" y1="42" x2="852" y2="42" stroke="#475258" stroke-width="1"/><text x="28" y="74" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#7fbbb3" font-weight="700">01</text><text x="68" y="74" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#d3c6aa">Japonês todos os dias, rumo ao N2.</text><text x="28" y="105" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#dbbc7f" font-weight="700">02</text><text x="68" y="105" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#d3c6aa">Ganhar experiência como dev, no time de software da Infomatic ou numa vaga júnior de backend.</text><text x="28" y="136" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#e69875" font-weight="700">03</text><text x="68" y="136" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#d3c6aa">Levar o MVP do L9s até o fim e publicar o Precify API com testes e deploy.</text><text x="28" y="167" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#d699b6" font-weight="700">04</text><text x="68" y="167" font-family="'DejaVu Sans', Helvetica, Arial, sans-serif" font-size="14" fill="#d3c6aa">Concluir a certificação AWS Cloud Practitioner.</text></svg>
